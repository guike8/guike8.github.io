      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 2rem; }
      main { width: min(100%, 36rem); padding: 1rem 0; }
      .hello { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 2rem; }

      .interests { list-style: none; padding: 0; margin: 0 0 2.25rem; display: grid; gap: 0.6rem; line-height: 1.5; }
      .interests li { display: flex; align-items: baseline; gap: 0.9rem; }
      .interests li::before { content: '—'; color: #65735e; }
      a { color: #b5d7a1; text-underline-offset: 0.35em; text-decoration-thickness: 1px; line-height: 1.7; }
      a:hover { color: #edf8e6; }
      a:focus-visible { outline: 2px solid #b5d7a1; outline-offset: 7px; border-radius: 1px; }
      .signoff { color: #7d8878; font-size: 0.8rem; line-height: 1.7; margin: 2.5rem 0 0; }
      .signoff span { color: #a1b494; white-space: nowrap; }
      @media (max-width: 420px) { body { padding: 1.5rem; } .hello { margin-bottom: 1.5rem; } .intro { font-size: 0.95rem; } }
