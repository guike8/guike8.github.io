global
    maxconn 192
    nbthread 1
    tune.bufsize 16384
    ssl-default-bind-options ssl-min-ver TLSv1.2
    # Request payloads and credentials must never enter ingress access logs.

defaults
    mode http
    timeout connect 3s
    timeout client 15s
    timeout server 15s
    timeout http-request 5s
    timeout http-keep-alive 2s
    timeout queue 2s

frontend web_in
    bind :8080
    bind :8443 ssl crt /run/secrets/frontend.pem
    maxconn 112
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request set-header X-Nightjar-Source %[src]
    http-request deny deny_status 405 if { method CONNECT }
    default_backend web_decoy

backend web_decoy
    server staging-web web:8080

frontend ssh_in
    mode tcp
    bind :2222
    maxconn 64
    timeout client 10m
    default_backend ssh_decoy

backend ssh_decoy
    mode tcp
    timeout server 10m
    server staging-ssh ssh:2222 send-proxy
