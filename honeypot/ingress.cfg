global
    maxconn 192
    nbthread 1
    tune.bufsize 32768
    ssl-default-bind-options ssl-min-ver TLSv1.2
    # Request payloads and credentials must never enter ingress access logs.

defaults
    mode http
    timeout connect 3s
    timeout client 15s
    timeout server 15s
    timeout http-request 5s
    timeout http-keep-alive 2s
    timeout queue 2s

frontend web_in
    bind :8080
    bind :8443 ssl crt /run/secrets/frontend.pem
    # Unpublished; compose.tunnel.yaml alone attaches the connector network.
    bind :8081
    maxconn 112
    acl tunnel_listener dst_port 8081
    acl tunnel_connector src 172.30.244.2/32
    acl single_tunnel_ip req.hdr_cnt(CF-Connecting-IP) eq 1
    acl single_tunnel_field req.fhdr_cnt(CF-Connecting-IP) eq 1
    # IP matching also accepts CIDRs/IPv4 ports; require a bare literal first.
    acl literal_tunnel_ip req.fhdr(CF-Connecting-IP) -m reg ^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$
    acl literal_tunnel_ip req.fhdr(CF-Connecting-IP) -m reg ^[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*$
    acl valid_tunnel_ip req.fhdr(CF-Connecting-IP) -m ip 0.0.0.0/0 ::/0
    http-request deny deny_status 403 if tunnel_listener !tunnel_connector
    http-request deny deny_status 400 if tunnel_listener !single_tunnel_ip
    http-request deny deny_status 400 if tunnel_listener !single_tunnel_field
    http-request deny deny_status 400 if tunnel_listener !literal_tunnel_ip
    http-request deny deny_status 400 if tunnel_listener !valid_tunnel_ip
    http-request set-var(txn.source_ip) src
    http-request set-var(txn.source_ip) req.fhdr(CF-Connecting-IP) if tunnel_listener tunnel_connector
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Real-IP
    http-request del-header CF-Connecting-IP
    http-request del-header CF-Connecting-IPv6
    http-request del-header True-Client-IP
    http-request set-header X-Forwarded-For %[var(txn.source_ip)]
    http-request set-header X-Nightjar-Source %[var(txn.source_ip)]
    http-request deny deny_status 405 if { method CONNECT }
    http-request deny deny_status 414 if { url_len gt 4096 }
    http-request deny deny_status 431 if { req.hdrs_bin,length gt 8192 }
    acl artifact_path path -i /upload /api/upload
    # Beelzebub has no HTTP body deadline: finish small requests at ingress.
    # Binary artifact streams keep their own hard deadline and 2 MiB limit.
    http-request deny deny_status 413 if !artifact_path { req.body_size gt 8192 }
    http-request wait-for-body time 5s at-least 8193 if !artifact_path
    http-request deny deny_status 413 if !artifact_path { req.body_size gt 8192 }
    use_backend artifact_intake if artifact_path
    default_backend beelzebub_http

backend beelzebub_http
    server staging-beelzebub beelzebub:8080 maxconn 48

backend artifact_intake
    server staging-upload web:8080 maxconn 16

frontend ssh_in
    mode tcp
    bind :2222
    maxconn 64
    timeout client 10m
    default_backend ssh_decoy

backend ssh_decoy
    mode tcp
    timeout server 10m
    server staging-ssh ssh:2222 send-proxy
