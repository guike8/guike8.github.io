[honeypot]
hostname = staging-02
sensor_name = staging-02
backend = shell
log_path = /cowrie/var/log/cowrie
state_path = /cowrie/var/lib/cowrie
etc_path = /cowrie/etc
download_path = /cowrie/var/lib/cowrie/downloads
ttylog = false
idle_timeout = 90
authentication_timeout = 45
interactive_timeout = 600
# This is a byte limit, not a way to turn downloads off. Egress is separately blocked.
download_limit_size = 1048576
auth_class = UserDB
timezone = UTC
log_level = warn
log_level_cowrie.events = critical

[shell]
filesystem = /opt/observatory/fs.pickle
kernel_version = 6.1.0-21-amd64
kernel_build_string = #1 SMP PREEMPT_DYNAMIC Debian 6.1.90-1 (2024-05-03)
hardware_platform = x86_64
operating_system = GNU/Linux
ssh_version = OpenSSH_9.2p1 Debian-2+deb12u3, OpenSSL 3.0.11 19 Sep 2023
max_input_size = 4096
# Refuse SCP uploads; interactive shell file edits remain in the emulated tree.
scp_max_files_per_session = 0

[ssh]
enabled = true
# Only the isolated HAProxy backend network can reach this listener.
# A direct SSH stream without a PROXY preamble is rejected.
listen_endpoints = haproxy:tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3
sftp_enabled = false
forwarding = false
forward_redirect = false
forward_tunnel = false
auth_publickey_allow_any = false
auth_keyboard_interactive_enabled = false
compression = none

[telnet]
enabled = false

[output_jsonlog]
enabled = false

[output_observatory]
enabled = true
logfile = /cowrie/var/log/cowrie/events.json
max_bytes = 2097152
backups = 3
